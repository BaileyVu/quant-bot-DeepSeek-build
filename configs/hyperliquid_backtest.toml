environment = "dev"

[runtime]
mode = "backtest"
exchange = "hyperliquid"
primary_symbol = "BTC-PERP"
symbols = ["BTC-PERP", "ETH-PERP"]
bar_interval = "1m"
funding_interval_minutes = 480

[risk]
max_daily_loss = 0.025
max_drawdown = 0.2
max_order_notional = 40000
max_leverage = 2.5
max_open_positions = 4
per_symbol_notional = { "BTC-PERP" = 60000, "ETH-PERP" = 35000 }

[data]
data_dir = "./data/hyperliquid"
aggregation = "1m"

[api]
request_timeout = 3.0
max_retries = 3
retry_backoff_seconds = 0.4
rate_limit = { requests_per_minute = 600, burst = 120 }

[fees]
maker_bps = 0.01
taker_bps = 0.04

[logging]
level = "INFO"

[storage]
url = "sqlite:///./quantbot-hyperliquid.db"
