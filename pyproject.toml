[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-bot"
version = "0.2.0"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "ccxt>=4.3",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "ta>=0.11.0",
    "joblib>=1.4",
    "rich>=13.7",
    "tqdm>=4.66",
    "aiohttp>=3.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quantbot*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "B", "Q"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
